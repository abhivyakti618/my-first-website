<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styleformpage.css">
</head>

<body>

    <div class="container">

        <div class="logo">🪷</div>

        <h1>Your journey starts here</h1>
        <h2>Take the first step</h2>

        <div class="form">

            <div class="input-box">
                <span>✉</span>
                <input type="email" placeholder="E-mail">
            </div>
            <div class="input-box">
                <span>👤</span>
                <input type="text" placeholder="Username">
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input type="password" placeholder="Password">
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input type="password" placeholder="Confirm password">
            </div>

            <button>Sign up</button>

            <div class="or">
                <div></div>
                <span>or</span>
                <div></div>
            </div>

            <div class="social">
                <span>f</span>
                <span>●</span>
                <span>G</span>
            </div>

            <p class="signin">
                Already have an account?
                <a href="#">Sign in</a>
            </p>

        </div>
    </div>

</body>
</html>
